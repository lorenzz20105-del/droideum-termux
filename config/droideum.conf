# =============================================================================
#  droideum configuration — copy to ~/droideum/droideum.conf (Termux side).
#  Plain shell, sourced on every run. Anything set here overrides the default.
#  Precedence: exported environment variable > this file > built-in default,
#  so `RAM_MB=768 droideum up` always wins over what is written here.
#  `droideum profile use <name>` appends a managed block at the bottom; leave it
#  alone and edit the values above it.
# =============================================================================

# --- CPU / memory ------------------------------------------------------------
# Default: 40% of device RAM, clamped 1536-4096 MB. 2048 is the sweet spot.
#RAM_MB=2048

# Default: half your cores, clamped 2-6. TCG scales with cores.
#CORES=4

# 'max' lets QEMU-TCG use every emulatable instruction (host SIMD included).
# Never set 'host' — it only works with KVM.
#CPU_MODEL=max

# TCG translation-block cache in MB. 256 is a good default; drop to 128 on a
# 4 GB phone (RAM matters more than the cache there), raise to 512 on 8 GB+.
#TB_SIZE=256

# 'auto' uses KVM when /dev/kvm is genuinely usable (rooted device or a Linux
# host) and silently falls back to TCG. 'never' forces TCG.
#USE_KVM=auto

# --- speed: warm state -------------------------------------------------------
# Name used by `droideum suspend` / `resume` / `up`. Machine state (RAM + disk)
# is stored inside the qcow2, so resuming skips boot and fsck entirely.
#AUTOSAVE_NAME=autosave

# 1 = `droideum stop` behaves like `suspend` (keeps the machine state).
#SAVE_ON_STOP=0

# Seconds to wait for Android's ACPI shutdown before escalating to SIGTERM.
#STOP_TIMEOUT=90

# --- display -----------------------------------------------------------------
# vnc  : headless, view with any VNC app on the phone at 127.0.0.1:5900
# gtk  : draw into Termux:X11 (x11-repo + termux-x11-nightly)
# sdl  : SDL window
# none : headless, drive everything through adb (agents)
#DISPLAY_BACKEND=vnc
#VNC_ADDR=127.0.0.1
#VNC_DISPLAY=0            # port is 5900 + VNC_DISPLAY

# --- adb ---------------------------------------------------------------------
#ADB_PORT=5555

# --- storage -----------------------------------------------------------------
# qcow2: starts small, grows as used, and gives deleted space back
# (discard=unmap is set for you).
#DISK_SIZE=16G
#DISK_FILE=$DROIDEUM_HOME/android.img
#MIN_FREE_MB=6000         # doctor warns below this

# --- system image ------------------------------------------------------------
# Default: Android-x86 9.0-r2 (Android 9, Pie). Set ISO_SHA1=skip for custom
# images. `droideum profile use android9-lite|bliss14` writes this for you.
#ISO_URL=https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download
#ISO_SHA1=1cc85b5ed7c830ff71aecf8405c7281a9c995aa0

# --- ARM translation layer (libhoudini) --------------------------------------
# Needed for APKs that ship only ARM natives. `droideum armbridge` uses these.
#HOUDINI_URL_32=http://dl.android-x86.org/houdini/9_y/houdini.sfs
#HOUDINI_URL_64=http://dl.android-x86.org/houdini/9_z/houdini.sfs

# --- QEMU extras -------------------------------------------------------------
# Appended verbatim. Useful:
#   -device virtio-vga            second VGA device some images prefer
#   -soundhw ac97                 older audio path
#   -nic user,model=virtio-net    if e1000 misbehaves
# Never add -accel kvm here: there is no /dev/kvm on a stock phone.
#EXTRA_QEMU_ARGS=""
